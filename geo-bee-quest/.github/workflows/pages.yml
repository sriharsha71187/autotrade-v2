# Deploys GeoBee Quest to GitHub Pages.
# The site is served from the gh-pages branch (Settings → Pages shows it as
# the source); this workflow mirrors main → gh-pages on every push, so a
# push to main is all it takes to update the live site.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
